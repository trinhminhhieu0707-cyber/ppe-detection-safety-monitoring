version: '3.8'

services:
  backend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
    container_name: ppe_backend
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    restart: unless-stopped
    networks:
      - ppe_network

  frontend:
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
    container_name: ppe_frontend
    ports:
      - "8501:8501"
    env_file:
      - ../.env
    volumes:
      - ../data:/app/data
      - ../models:/app/models
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ppe_network

networks:
  ppe_network:
    driver: bridge

