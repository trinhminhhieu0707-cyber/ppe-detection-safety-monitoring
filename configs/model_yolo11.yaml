# YOLO11 Model & Training Hyperparameters Configuration
# Architecture choices: yolo11n (Realtime latency), yolo11s (Balanced PPE accuracy)

model:
  name: yolo11s.pt
  baseline: yolo11n.pt
  num_classes: 9
  input_size: 640

training:
  epochs: 60
  batch_size: 16
  imgsz: 640
  optimizer: AdamW
  lr0: 0.002
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  cos_lr: true
  patience: 15

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  shear: 0.0
  perspective: 0.0
  flipud: 0.0
  fliplr: 0.5
  mosaic: 1.0
  mixup: 0.1
  close_mosaic: 10

validation:
  split: test
  conf_threshold: 0.25
  iou_threshold: 0.65

export:
  format: onnx
  dynamic: true
  simplify: true

